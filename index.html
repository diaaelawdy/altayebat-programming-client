<!doctype html>
<html lang="en" dir="ltr" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free, anonymous, community-driven interview questions from companies in Egypt and the region." />
    <meta name="theme-color" content="#0d0d0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Altayebat Programming — Interview questions, by candidates</title>
    <script>
      // Apply saved theme + language before first paint (no flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('mk.prefs') || 'null');
          var root = document.documentElement;
          if (!p) return;
          var mode = p.mode === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p.mode;
          root.dataset.mode = mode || 'dark';
          if (p.locale === 'ar') { root.lang = 'ar'; root.dir = 'rtl'; }
          if (p.accent) root.style.setProperty('--accent', p.accent);
          var pal = p[mode] || {};
          ['bg', 'surface', 'fg'].forEach(function (k) { if (pal[k]) root.style.setProperty('--' + k, pal[k]); });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
